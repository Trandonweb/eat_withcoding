<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0e8">
  <title>꿀꿀! 돼지 밥 먹는 날</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap');
    :root{--pink:#ff8eaa;--deep:#e85f85;--cream:#fffaf3;--ink:#503c3a;--green:#8ebf91}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#fff 0 2px,transparent 3px),linear-gradient(145deg,#fff3eb,#ffe5eb 55%,#fff4d9);background-size:34px 34px,auto}
    .page{width:min(100% - 32px,920px);margin:auto;padding:34px 0 48px}
    header{text-align:center;margin-bottom:22px}
    .eyebrow{display:inline-block;background:#fff;border:2px solid #ffd1dc;border-radius:99px;padding:7px 15px;font-size:13px;font-weight:800;color:var(--deep);letter-spacing:.08em}
    h1{font-family:'Jua',sans-serif;font-size:clamp(34px,7vw,58px);margin:13px 0 5px;color:#d94f78;text-shadow:0 3px #fff}
    header p{margin:0;color:#8b6e69;font-size:15px}
    .game{background:#ffffffd9;border:3px solid #fff;border-radius:30px;padding:clamp(16px,4vw,32px);box-shadow:0 18px 50px #bd728026;backdrop-filter:blur(8px)}
    .stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .stat{background:#fff4f5;border:1px solid #ffdae2;border-radius:16px;padding:10px 16px;font-weight:800;color:#bd5875}
    .stat span{font-family:'Jua',sans-serif;font-size:23px;margin-left:5px}
    .scene{position:relative;min-height:330px;display:grid;place-items:center;overflow:hidden;border-radius:24px;background:linear-gradient(#dff4ff 0 65%,#b9dda9 65%);border:2px solid #e8f4e8}
    .cloud{position:absolute;font-size:45px;opacity:.75;animation:drift 8s ease-in-out infinite alternate}
    .cloud.one{top:24px;left:10%}.cloud.two{top:55px;right:12%;animation-delay:-3s;font-size:35px}
    @keyframes drift{to{transform:translateX(18px)}}
    .pig-wrap{position:relative;z-index:2;transform-origin:50% 90%;transition:transform .2s}
    .pig-wrap.eating{animation:chew .38s ease-in-out 3}
    @keyframes chew{0%,100%{transform:rotate(0) scale(1)}35%{transform:rotate(-5deg) scale(1.04)}70%{transform:rotate(4deg) scale(1.02)}}
    .pig{width:220px;height:210px;position:relative}
    .ear{position:absolute;top:13px;width:66px;height:78px;background:#f6a9b4;border:4px solid #d9788c;border-radius:70% 30% 60% 40%;z-index:0}
    .ear.left{left:30px;transform:rotate(-23deg)}.ear.right{right:30px;transform:scaleX(-1) rotate(-23deg)}
    .head{position:absolute;inset:34px 10px 0;background:#ffb8c1;border:4px solid #d9788c;border-radius:48% 48% 45% 45%;z-index:1;box-shadow:inset 0 -8px #f69eae}
    .eye{position:absolute;top:69px;width:10px;height:14px;background:#503c3a;border-radius:50%}
    .eye.left{left:65px}.eye.right{right:65px}
    .snout{position:absolute;top:93px;left:50%;transform:translateX(-50%);width:76px;height:53px;border-radius:50%;background:#f48d9e;border:3px solid #d9788c;display:flex;justify-content:center;align-items:center;gap:17px}
    .nostril{width:9px;height:17px;border-radius:50%;background:#a94f64}
    .mouth{position:absolute;top:151px;left:50%;width:25px;height:12px;transform:translateX(-50%);border-bottom:3px solid #a94f64;border-radius:0 0 50% 50%}
    .cheek{position:absolute;top:112px;width:24px;height:13px;border-radius:50%;background:#ff8eaa;opacity:.7}
    .cheek.left{left:28px}.cheek.right{right:28px}
    .body{position:absolute;z-index:0;bottom:-44px;left:28px;width:164px;height:91px;border-radius:48% 48% 35% 35%;background:#f6a9b4;border:4px solid #d9788c}
    .feet{position:absolute;z-index:2;bottom:-48px;left:48px;width:32px;height:22px;border-radius:50%;background:#d9788c;box-shadow:90px 0 #d9788c}
    .bowl{position:absolute;z-index:3;bottom:14px;left:50%;transform:translateX(-50%);width:142px;height:48px;border-radius:8px 8px 55px 55px;background:linear-gradient(#83b9d6 0 18%,#5f9fbe 18%);border:4px solid #4f8eae;box-shadow:0 8px 0 #00000012}
    .food{position:absolute;z-index:4;bottom:48px;left:50%;transform:translateX(-50%);font-size:36px;white-space:nowrap;filter:drop-shadow(0 2px 1px #795c3b44)}
    .food.fly{animation:fly  .6s ease-in forwards}
    @keyframes fly{0%{transform:translate(170px,-160px) scale(1.3) rotate(0)}70%{transform:translate(20px,-55px) scale(1) rotate(200deg)}100%{transform:translate(0,0) scale(.5) rotate(300deg);opacity:0}}
    .message{min-height:34px;text-align:center;font-family:'Jua',sans-serif;font-size:22px;color:#c65b78;margin:16px 0 10px}
    .food-label{text-align:center;font-size:13px;color:#967b76;font-weight:700;margin:4px 0 10px}
    .foods{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .food-btn{border:2px solid #f5d5d9;background:#fff;border-radius:17px;padding:10px 15px;min-width:82px;font:700 14px 'Noto Sans KR';color:var(--ink);cursor:pointer;transition:.18s}
    .food-btn b{display:block;font-size:27px;margin-bottom:2px}
    .food-btn:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 6px 14px #e88aa533}
    .food-btn:active{transform:scale(.96)}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
    button:focus-visible{outline:3px solid #5f9fbe;outline-offset:3px}
    .feed{border:0;border-radius:99px;padding:14px 30px;background:linear-gradient(135deg,#ff91aa,#ed6e91);color:white;font:24px 'Jua',sans-serif;box-shadow:0 6px 0 #c95276;cursor:pointer;transition:.15s}
    .feed:hover{filter:brightness(1.04);transform:translateY(-2px)}
    .feed:active{transform:translateY(3px);box-shadow:0 3px 0 #c95276}
    .reset{border:2px solid #e9d8d4;background:white;border-radius:99px;padding:12px 20px;color:#8b6e69;font-weight:800;cursor:pointer}
    .progress{margin:22px auto 0;max-width:460px}
    .progress-top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#8b6e69;margin-bottom:7px}
    .bar{height:14px;background:#f4e6e3;border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ff7f9e);border-radius:99px;transition:width .35s}
    footer{text-align:center;font-size:12px;color:#a58b85;margin-top:18px}
    @media(max-width:480px){.scene{min-height:300px}.pig{transform:scale(.88)}.stat{padding:8px 11px;font-size:13px}.stat span{font-size:20px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">🐷 오늘의 작은 행복</div>
      <h1>꿀꿀! 돼지 밥 먹는 날</h1>
      <p>배고픈 아기 돼지에게 맛있는 밥을 주세요!</p>
    </header>
    <section class="game" aria-label="돼지 밥 먹이기 게임">
      <div class="stats">
        <div class="stat">🍚 먹은 음식 <span id="count">0</span></div>
        <div class="stat">💗 행복 지수 <span id="happy">0%</span></div>
      </div>
      <div class="scene">
        <div class="cloud one">☁️</div><div class="cloud two">☁️</div>
        <div class="pig-wrap" id="pig">
          <div class="pig" aria-label="분홍색 아기 돼지 그림">
            <div class="ear left"></div><div class="ear right"></div>
            <div class="body"></div><div class="feet"></div>
            <div class="head">
              <div class="eye left"></div><div class="eye right"></div>
              <div class="cheek left"></div><div class="cheek right"></div>
              <div class="snout"><i class="nostril"></i><i class="nostril"></i></div>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
        <div class="food" id="food">🍚</div>
        <div class="bowl"></div>
      </div>
      <div class="message" id="message" aria-live="polite">꿀꿀! 배고파요! 밥 주세요!</div>
      <div class="food-label">먼저 돼지에게 줄 음식을 골라 보세요</div>
      <div class="foods">
        <button class="food-btn" data-food="🍚" data-name="밥"><b>🍚</b>따끈한 밥</button>
        <button class="food-btn" data-food="🥕" data-name="당근"><b>🥕</b>아삭 당근</button>
        <button class="food-btn" data-food="🍎" data-name="사과"><b>🍎</b>달콤 사과</button>
        <button class="food-btn" data-food="🥬" data-name="상추"><b>🥬</b>싱싱 상추</button>
      </div>
      <div class="actions">
        <button class="feed" id="feed">밥 주기! 🍽️</button>
        <button class="reset" id="reset">처음부터</button>
      </div>
      <div class="progress">
        <div class="progress-top"><span>🐽 돼지의 배부름</span><span id="percent">0 / 10</span></div>
        <div class="bar"><div class="bar-fill" id="bar"></div></div>
      </div>
    </section>
    <footer>조금씩 맛있게 먹어요 · 아기 돼지의 식사 시간 🩷</footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let selected = '🍚', foodName = '밥', count = 0, busy = false;
    document.querySelectorAll('.food-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selected = btn.dataset.food;
        foodName = btn.dataset.name;
        document.querySelectorAll('.food-btn').forEach(b => b.style.background = b === btn ? '#fff0f3' : '#fff');
        $('message').textContent = foodName + ' 선택 완료! 이제 밥을 주세요.';
        $('food').textContent = selected;
      });
    });
    $('feed').addEventListener('click', () => {
      if (busy) return;
      if (count >= 10) { $('message').textContent = '꿀꿀! 배가 빵빵해요! 고마워요! 💗'; return; }
      busy = true;
      const food = $('food');
      food.textContent = selected;
      food.classList.remove('fly');
      void food.offsetWidth;
      food.classList.add('fly');
      $('pig').classList.remove('eating');
      setTimeout(() => $('pig').classList.add('eating'), 450);
      setTimeout(() => {
        count++;
        $('count').textContent = count;
        $('happy').textContent = Math.min(100, count * 10) + '%';
        $('percent').textContent = count + ' / 10';
        $('bar').style.width = count * 10 + '%';
        const messages = ['냠냠! 맛있어요! 😋','우와, 정말 맛있다!','꿀꿀! 한입 더 주세요!','최고의 식사예요!'];
        $('message').textContent = count === 10 ? '배불러요! 오늘 밥 최고였어요! 🐷💗' : messages[Math.floor(Math.random()*messages.length)];
        food.classList.remove('fly');
        food.textContent = selected;
        busy = false;
      }, 850);
    });
    $('reset').addEventListener('click', () => {
      count = 0; busy = false;
      $('count').textContent = '0'; $('happy').textContent = '0%';
      $('percent').textContent = '0 / 10'; $('bar').style.width = '0%';
      $('message').textContent = '꿀꿀! 배고파요! 밥 주세요!';
      $('pig').classList.remove('eating');
      $('food').classList.remove('fly'); $('food').textContent = selected;
    });
  </script>
</body>
</html>
